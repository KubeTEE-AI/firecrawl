name: KubeTEE Firecrawl release
run-name: Firecrawl v2.11.731-kubetee.1 — GitHub GHCR source verification

# Immutable package recovery only. Image was built natively on GitHub-hosted ubuntu
# AMD64 by run 43300067734. All functional testing is exclusively on KubeTEE staging;
# this job intentionally contains no Docker, Buildx, test harness or application test.
on:
  workflow_dispatch: {}
  push:
    branches: [kubetee-release-2-11-731-1]
    paths: [.github/workflows/ci-probe.yml]

permissions:
  contents: write

env:
  RELEASE_VERSION: v2.11.731-kubetee.1
  DIGEST: sha256:9fb2c1b0dfeeb6b9fc37e3d650341629d377e5bf9baab269d0ab835df47d642f
  IMAGE: ghcr.io/kubetee-ai/firecrawl
  SOURCE_REPO: https://github.com/KubeTEE-AI/firecrawl
  UPSTREAM_REPO: https://github.com/firecrawl/firecrawl.git
  APPLICATION_COMMIT: 841f0808d4c1e5c4812fc70e39470c24f9dac49b
  BUILD_RUN: https://github.com/KubeTEE-AI/firecrawl/actions/runs/43300067734

jobs:
  verify-native-package-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify GitHub source and identical application tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'KubeTEE-AI/firecrawl'
          test "${GITHUB_REF}" = 'refs/heads/kubetee-release-2-11-731-1'
          git clone --filter=blob:none --no-checkout "${SOURCE_REPO}.git" src
          git -C src checkout --quiet --detach "${GITHUB_SHA}"
          test "$(git -C src rev-parse 'HEAD:.github/workflows/ci-probe.yml')" = "$(git hash-object '.github/workflows/ci-probe.yml')"
          git -C src merge-base --is-ancestor "${APPLICATION_COMMIT}" "${GITHUB_SHA}"
          test -z "$(git -C src diff --name-only "${GITHUB_SHA}" "${APPLICATION_COMMIT}" -- apps)"
          base=$(git ls-remote "${UPSTREAM_REPO}" 'refs/tags/v2.11.731^{}' | awk '{print $1}')
          test "${#base}" = 40
          git -C src merge-base --is-ancestor "${base}" "${APPLICATION_COMMIT}"

      - name: Verify exact native GHCR manifest and complete SLSA source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node <<'JS'
  const assert = require('node:assert/strict');
  const crypto = require('node:crypto');
  const fs = require('node:fs');
  const https = require('node:https');

  function get(url, headers = {}, depth = 0) {
    if (depth > 8) throw new Error('excessive registry redirects');
    return new Promise((resolve, reject) => {
      https.get(url, { headers }, res => {
        if ([301, 302, 307, 308].includes(res.statusCode)) {
          res.resume();
          return resolve(get(res.headers.location, {}, depth + 1));
        }
        const chunks = [];
        res.on('data', chunk => chunks.push(chunk));
        res.on('end', () => resolve({ status: res.statusCode, headers: res.headers, body: Buffer.concat(chunks) }));
        res.on('error', reject);
      }).on('error', reject).setTimeout(90000, function () { this.destroy(new Error('registry timeout')); });
    });
  }

  (async () => {
    const { GH_TOKEN, APPLICATION_COMMIT, DIGEST, IMAGE, RELEASE_VERSION, BUILD_RUN, SOURCE_REPO } = process.env;
    // Repository write is needed to read the package linked to the private fork.
    const resource = IMAGE.replace('ghcr.io/', '');
    const request = { Authorization: `Bearer ${GH_TOKEN}`, Accept: 'application/vnd.oci.image.index.v1+json' };
    const index = await get(`https://ghcr.io/v2/${resource}/manifests/${RELEASE_VERSION}`, request);
    const manifest = await get(`https://ghcr.io/v2/${resource}/manifests/${DIGEST}`, request);
    assert.equal(index.status, 200, JSON.stringify(index.headers));
    assert.equal(manifest.status, 200, JSON.stringify(manifest.headers));
    assert.equal(manifest.headers['docker-content-digest'], DIGEST);
    assert.equal(crypto.createHash('sha256').update(manifest.body).digest('hex'), DIGEST.slice(7));
    const doc = manifest.json ? manifest.json : JSON.parse(manifest.body);
    assert.equal(doc.mediaType, 'application/vnd.oci.image.index.v1+json');
    const app = doc.manifests.find(item => item.platform.architecture === 'amd64' && item.platform.os === 'linux');
    assert(app, 'missing linux/amd64 application manifest');
    assert.equal(doc.manifests.filter(item => item.platform.architecture === 'amd64').length, 1);
    const attestation = doc.manifests.find(item => item.annotations?.['vnd.docker.reference.type'] === 'attestation-manifest');
    assert(attestation, 'missing native build attestation');
    assert.equal(attestation.annotations['vnd.docker.reference.digest'], app.digest);

    const att = await get(`https://ghcr.io/v2/${resource}/manifests/${attestation.digest}`, request);
    assert.equal(att.status, 200);
    const attDoc = JSON.parse(att.body);
    const blob = await get(`https://ghcr.io/v2/${resource}/blobs/${attDoc.layers[0].digest}`, request);
    assert.equal(blob.status, 200);
    const envelope = JSON.parse(blob.body);
    assert.equal(envelope.payloadType, 'application/vnd.in-toto+json');
    const predicate = JSON.parse(Buffer.from(envelope.payload, 'base64').toString('utf8'));
    const invocation = JSON.parse(predicate.predicate.invocation.parameters.frontend);
    const requestArgs = invocation.request.args;
    assert.equal(predicate.subject[0].digest.sha256, app.digest.slice(7));
    assert.equal(invocation.request.frontend, 'gateway.v0');
    assert.equal(requestArgs['label:org.opencontainers.image.source'], `${SOURCE_REPO}.git`);
    for (const key of ['label:org.opencontainers.image.revision', 'build-arg:GIT_SHA']) assert.equal(requestArgs[key], APPLICATION_COMMIT);
    assert.equal(requestArgs['label:org.opencontainers.image.version'], RELEASE_VERSION);
    for (const key of ['build-arg:compile_env', 'build-arg:install_env']) assert.equal(requestArgs[key], 'production');
    const dependency = invocation.request.resolvedDependencies.find(item => item.uri.startsWith('pkg:docker/node@22.23.5-slim?'));
    assert.deepEqual(dependency.digest, { sha256: 'e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee' });
    assert(dependency.uri.includes('platform=linux%2Famd64'));
    console.log(JSON.stringify({ image: `${IMAGE}:${RELEASE_VERSION}@${DIGEST}`, applicationManifest: app.digest, source: `${SOURCE_REPO}/commit/${APPLICATION_COMMIT}`, build: BUILD_RUN }, null, 2));
    fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, `## Native Firecrawl package verified\n\n- Image: \`${IMAGE}:${RELEASE_VERSION}@${DIGEST}\`\n- Application source: ${SOURCE_REPO}/commit/${APPLICATION_COMMIT}\n- Native GitHub build: ${BUILD_RUN}\n- linux/amd64; SLSA source, digest and production inputs verified by GitHub Node HTTPS.\n- Functional testing: KubeTEE staging only; no local/Docker application tests.\n`);
  })().catch(error => { console.error(error); process.exit(1); });
JS

      - name: Publish immutable source tag and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq .object.sha)" = "${APPLICATION_COMMIT}" || {
            test "$(git ls-remote "${SOURCE_REPO}.git" "refs/tags/${RELEASE_VERSION}")" = ""
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${RELEASE_VERSION}" -f "sha=${APPLICATION_COMMIT}"
          }
          gh release create "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${APPLICATION_COMMIT}" \
            --title 'Firecrawl v2.11.731-kubetee.1 — attested provider search' --verify-tag \
            --notes "Native GitHub Actions AMD64 build ${BUILD_RUN}. Exact application source ${APPLICATION_COMMIT}; immutable image ${IMAGE}:${RELEASE_VERSION}@${DIGEST}. Provider routing includes dynamic inventory, circuit breaking, bounded retries and concurrent hedging. Provider API keys are Trustee KBS/CDH-only, never runtime environment. Functional tests exclusively on KubeTEE staging."

      - name: Confirm no borrowed source credentials
        run: |
          set -euo pipefail
          if test -f src/.git/config && grep -q 'http.*extraheader' src/.git/config; then
            echo 'Checkout contains credential configuration.' >&2
            exit 1
          fi
          find . -maxdepth 1 -name 'provenance.json' -exec test ! -s {} \;
