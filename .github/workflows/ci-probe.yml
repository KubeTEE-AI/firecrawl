name: Probe Native Runner Tools

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: New immutable release tag
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref == 'refs/heads/kubetee-provider-patch'
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/kubetee-ai/firecrawl
    steps:
      - name: Check native Git and Docker
        shell: bash
        run: |
          set -euo pipefail
          command -v bash git curl docker
          docker buildx version
          docker version
          git ls-remote https://github.com/KubeTEE-AI/firecrawl.git refs/heads/kubetee-provider-patch
