name: KubeTEE Firecrawl release
run-name: Firecrawl v2.11.731-kubetee.1 — GitHub GHCR source verification

# Immutable package recovery only. Image was built natively on GitHub-hosted ubuntu
# AMD64 by run 43300067734. All functional testing is exclusively on KubeTEE staging;
# this job intentionally contains no Docker, Buildx, test harness or application test.
on:
  workflow_dispatch: {}
  push:
    branches: [kubetee-release-2-11-731-1]
    paths: [.github/workflows/ci-probe.yml]

permissions:
  contents: write

env:
  RELEASE_VERSION: v2.11.731-kubetee.1
  DIGEST: sha256:9fb2c1b0dfeeb6b9fc37e3d650341629d377e5bf9baab269d0ab835df47d642f
  IMAGE: ghcr.io/kubetee-ai/firecrawl
  SOURCE_REPO: https://github.com/KubeTEE-AI/firecrawl
  UPSTREAM_REPO: https://github.com/firecrawl/firecrawl.git
  APPLICATION_COMMIT: 841f0808d4c1e5c4812fc70e39470c24f9dac49b
  BUILD_RUN: https://github.com/KubeTEE-AI/firecrawl/actions/runs/43300067734

jobs:
  verify-native-package-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify GitHub source and identical application tree
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'KubeTEE-AI/firecrawl'
          test "${GITHUB_REF}" = 'refs/heads/kubetee-release-2-11-731-1'
          git clone --filter=blob:none --no-checkout "${SOURCE_REPO}.git" src
          git -C src checkout --quiet --detach "${GITHUB_SHA}"
          test "$(git -C src rev-parse 'HEAD:.github/workflows/ci-probe.yml')" = "$(git hash-object '.github/workflows/ci-probe.yml')"
          git -C src merge-base --is-ancestor "${APPLICATION_COMMIT}" "${GITHUB_SHA}"
          test -z "$(git -C src diff --name-only "${GITHUB_SHA}" "${APPLICATION_COMMIT}" -- apps)"
          base=$(git ls-remote "${UPSTREAM_REPO}" 'refs/tags/v2.11.731^{}' | awk '{print $1}')
          test "${#base}" = 40
          git -C src merge-base --is-ancestor "${base}" "${APPLICATION_COMMIT}"

      - name: Verify exact native GHCR manifest and complete SLSA source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, json, os, urllib.request

          index = json.load(open('/tmp/ghcr-index.json'))
          attestation = next(item for item in index['manifests'] if item.get('annotations', {}).get('vnd.docker.reference.type') == 'attestation-manifest')
          subject = index['manifests'][0]
          assert subject['digest'] == attestation['annotations']['vnd.docker.reference.digest']
          assert subject['platform'] == {'architecture': 'amd64', 'os': 'linux'}
          assert sum(item['platform']['architecture'] == 'amd64' for item in index['manifests']) == 1

          # Anonymous token for a public package; no container/build tooling.
          auth = json.load(urllib.request.urlopen('https://ghcr.io/token?service=ghcr.io&scope=repository:kubetee-ai/firecrawl:pull'))
          envelope = json.load(urllib.request.urlopen('https://ghcr.io/v2/kubetee-ai/firecrawl/blobs/' + attestation['digest']))
          request = urllib.request.Request(f"https://ghcr.io/v2/kubetee-ai/firecrawl/blobs/{envelope['layers'][0]['digest']}", headers={'Authorization': 'Bearer ' + auth['token']})
          payload = json.load(urllib.request.urlopen(request))
          predicate = json.loads(base64.b64decode(payload['payload']))
          assert predicate['subject'][0]['digest']['sha256'] == subject['digest'][7:]
          definition = predicate['predicate']['buildDefinition']
          args = definition['externalParameters']['root']['request']['args']
          assert args['build-arg:GIT_SHA'] == os.environ['APPLICATION_COMMIT']
          assert args['label:org.opencontainers.image.revision'] == os.environ['APPLICATION_COMMIT']
          assert args['label:org.opencontainers.image.version'] == os.environ['RELEASE_VERSION']
          assert args['label:org.opencontainers.image.source'] == os.environ['SOURCE_REPO'] + '.git'
          assert args['build-arg:compile_env'] == args['build-arg:install_env'] == 'production'
          assert definition['buildType'] == 'https://github.com/docker/buildkit/blob/master/docs/build-repro.md'
          dependency = next(item for item in definition['resolvedDependencies'] if item['uri'].startswith('pkg:docker/node@22.23.5-slim?'))
          assert dependency['digest']['sha256'] == 'e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee'
          assert 'platform=linux%2Famd64' in dependency['uri']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'w') as output:
              output.write(f"## Native Firecrawl package verified\n\n- Image: `{os.environ['IMAGE']}:{os.environ['RELEASE_VERSION']}@{os.environ['DIGEST']}`\n- Source: {os.environ['SOURCE_REPO']}/commit/{os.environ['APPLICATION_COMMIT']}\n- Build: {os.environ['BUILD_RUN']}\n- linux/amd64; exact digest, SLSA source and production inputs verified via GHCR HTTPS. No Docker.\n- Functional tests: KubeTEE staging only.\n")
          print(json.dumps({'image': os.environ['IMAGE'] + '@' + os.environ['DIGEST'], 'source': os.environ['APPLICATION_COMMIT'], 'platform': subject['platform']}, indent=2))
          PY

      - name: Publish immutable source tag and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" --jq .object.sha)" = "${APPLICATION_COMMIT}" || {
            test "$(git ls-remote "${SOURCE_REPO}.git" "refs/tags/${RELEASE_VERSION}")" = ""
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${RELEASE_VERSION}" -f "sha=${APPLICATION_COMMIT}"
          }
          gh release create "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --target "${APPLICATION_COMMIT}" \
            --title 'Firecrawl v2.11.731-kubetee.1 — attested provider search' --verify-tag \
            --notes "Native GitHub Actions AMD64 build ${BUILD_RUN}. Exact application source ${APPLICATION_COMMIT}; immutable image ${IMAGE}:${RELEASE_VERSION}@${DIGEST}. Provider routing includes dynamic inventory, circuit breaking, bounded retries and concurrent hedging. Provider API keys are Trustee KBS/CDH-only, never runtime environment. Functional tests exclusively on KubeTEE staging."

      - name: Confirm no borrowed source credentials
        run: |
          set -euo pipefail
          if test -f src/.git/config && grep -q 'http.*extraheader' src/.git/config; then
            echo 'Checkout contains credential configuration.' >&2
            exit 1
          fi
          find . -maxdepth 1 -name 'provenance.json' -exec test ! -s {} \;
