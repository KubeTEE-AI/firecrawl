name: Test KubeTEE attested provider search
on:
  push:
    branches: [kubetee-provider-patch]
    paths:
      - apps/api/src/config.ts
      - apps/api/src/config*.node.test.ts
      - apps/api/src/search/v2/index.ts
      - apps/api/src/search/v2/supported*
      - apps/api/src/search/v2/*.node.test.ts
      - .github/workflows/test-kubetee-provider-search.yml
  pull_request:
    branches: [kubetee-provider-patch]

# Uses only native runner tools; no third-party action resolver or local image build.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Test source-isolated provider modules in Node 22
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none https://github.com/KubeTEE-AI/firecrawl.git src
          cd src
          git checkout --quiet "${GITHUB_SHA}"
          for test in apps/api/src/search/v2/*.node.test.ts apps/api/src/config.node.test.ts; do
            test -f "${test}"
            lib="/private/tmp/provider-$(basename "${test}" .ts)-lib"
            mkdir -p "${lib}"
            run()
            {
              docker run --rm --platform linux/amd64 -w /work \
                --mount type=bind,source="$PWD/$test",target="/work/${test##*/}",readonly \
                --mount type=bind,source="$PWD/apps/api/src/config.ts",target=/work/config.ts,readonly \
                --mount type=bind,source="$PWD/apps/api/src/types.ts",target=/work/types.ts,readonly \
                --mount type=bind,source="$PWD/apps/api/src/env.ts",target=/work/env.ts,readonly \
                --mount type=bind,source="$PWD/apps/api/src/search/v2/supported.ts",target=/work/supported.ts,readonly \
                --mount type=bind,source="$PWD/apps/api/src/search/v2/index.ts",target=/work/index.ts,readonly \
                --mount type=bind,source="${lib}",target=/work/node_modules${1:+,$1} \
                docker.io/library/node:22-alpine "${@:2}"
            }
            run '' sh -eu -c 'npm install --prefix /work --no-save pnpm@10.15.1 dotenv@17.2.2 zod@4.1.8 typescript@5.9.2 tsx@4.20.6'
            run readonly node --import tsx --test "/work/${test##*/}"
          done
