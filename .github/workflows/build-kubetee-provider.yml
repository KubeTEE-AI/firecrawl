name: Build KubeTEE attested-provider Firecrawl image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable KubeTEE release version, e.g. v2.11.731-kubetee.1
        required: true
        type: string
      base_tag:
        description: Verified upstream base release tag (defaults to version prefix)
        required: false
        default: v2.11.731
        type: string

# Only one build for this nonconcurrent GitHub-hosted builder name at a time.
concurrency:
  group: firecrawl-kubetee-ghcr-release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/kubetee-ai/firecrawl
  SOURCE_REPO: https://github.com/KubeTEE-AI/firecrawl.git
  UPSTREAM_REPO: https://github.com/firecrawl/firecrawl.git
  # setup-buildx-action v3.12.0 -> setup.docker.buildx = 0.38.2
  BUILDX_VERSION: 0.38.2
  # setup-buildx-action v3.12.0 image moby/buildkit:buildx-stable-1 at 2026-11-12.
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
    outputs:
      source_commit: ${{ steps.build.outputs.source_commit }}
      base_commit: ${{ steps.build.outputs.base_commit }}
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Verify immutable release identity and fetch exact source
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IFS=/ read -r owner repo <<< "${GITHUB_REPOSITORY}"
          test "${owner}/${repo}" = "KubeTEE-AI/firecrawl"
          test "${GITHUB_REF}" = "refs/heads/kubetee-provider-patch"
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-kubetee\.[1-9][0-9]*$ ]]
          [[ "${{ inputs.version }}" == "${{ inputs.base_tag }}-kubetee."* ]]
          [[ "${{ inputs.base_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh api --silent "repos/${owner}/${repo}/git/ref/tags/${{ inputs.version }}" 2>/dev/null; then
            echo "Refusing to reuse immutable release tag." >&2
            exit 1
          fi
          git clone --no-checkout --filter=blob:none "${SOURCE_REPO}" src
          cd src
          base_commit=$(git ls-remote "${UPSTREAM_REPO}" "refs/tags/${{ inputs.base_tag }}^{}" | awk '{print $1}')
          test "${#base_commit}" = 40
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "$(git rev-parse 'HEAD:.github/workflows/build-kubetee-provider.yml')" = "$(git hash-object ../.github/workflows/build-kubetee-provider.yml)"
          git merge-base --is-ancestor "${base_commit}" HEAD
          git log -1 --oneline "${base_commit}"
          git log -1 --oneline HEAD
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "base_commit=${base_commit}"
          } >> "${GITHUB_OUTPUT}"
          command -v bash git curl jq docker
          docker info

      - name: Test the exact source without external action dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd src
          # Runtime dependencies for the source-isolated Node test harnesses.
          for test in apps/api/src/search/v2/*.node.test.ts apps/api/src/config.node.test.ts; do
            test -f "${test}"
            lib="/private/tmp/firecrawl-$(basename "${test}" .ts)-lib"
            mkdir -p "${lib}"
            docker run --rm --platform linux/amd64 -w /work \
              --mount type=bind,source="${PWD}/${test}",target="/work/${test##*/}",readonly \
              --mount type=bind,source="${PWD}/apps/api/src/config.ts",target=/work/config.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/types.ts",target=/work/types.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/env.ts",target=/work/env.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/search/v2/supported.ts",target=/work/supported.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/search/v2/index.ts",target=/work/index.ts,readonly \
              --mount type=bind,source="${lib}",target=/work/node_modules \
              docker.io/library/node:22-alpine sh -eu -c \
              'npm install --prefix /work --no-save pnpm@10.15.1 dotenv@17.2.2 zod@4.1.8 typescript@5.9.2 tsx@4.20.6'
            docker run --rm --platform linux/amd64 -w /work \
              --mount type=bind,source="${PWD}/${test}",target="/work/${test##*/}",readonly \
              --mount type=bind,source="${PWD}/apps/api/src/config.ts",target=/work/config.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/types.ts",target=/work/types.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/env.ts",target=/work/env.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/search/v2/supported.ts",target=/work/supported.ts,readonly \
              --mount type=bind,source="${PWD}/apps/api/src/search/v2/index.ts",target=/work/index.ts,readonly \
              --mount type=bind,source="${lib}",target=/work/node_modules,readonly \
              docker.io/library/node:22-alpine \
              node --import tsx --test "/work/${test##*/}"
          done

      - name: Configure the native pinned Docker container builder
        id: buildx
        shell: bash
        run: |
          set -euo pipefail
          command -v bash git curl jq docker
          test "$(docker buildx version)" = 'github.com/docker/buildx v0.38.2 3c4cbd3f1e0ae8f546ba4b6b8b14f9c510ac4ccb'
          mkdir -p "${RUNNER_TEMP}/cli-plugins"
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64" \
            -o "${RUNNER_TEMP}/cli-plugins/docker-buildx"
          chmod 0755 "${RUNNER_TEMP}/cli-plugins/docker-buildx"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          docker buildx create --name kubetee-provider --driver docker-container \
            --driver-opt "image=${BUILDKIT_IMAGE}" --buildkitd-flags="--allow-insecure-entitlement security.insecure" --use
          docker pull --platform linux/amd64 docker/dockerfile:1
          printf 'authenticated_config=%s\n' "${RUNNER_TEMP}" >> "${GITHUB_ENV}"
          docker buildx inspect kubetee-provider --bootstrap

      - name: Build and publish the immutable image with provenance
        shell: bash
        run: |
          set -euo pipefail
          cd src
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --progress=plain \
            --builder kubetee-provider --platform linux/amd64 --provenance=mode=max \
            --no-cache --pull --push --label "org.opencontainers.image.source=${SOURCE_REPO}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ inputs.version }}" \
            --build-arg "install_env=production" \
            --build-arg "compile_env=production" \
            --tag "${GHCR_IMAGE}:${{ inputs.version }}" \
            -f apps/api/Dockerfile . | tee build.log
          digest=$(sed -n 's/.* name: '${GHCR_IMAGE}'.* digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' build.log | tail -1)
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${GHCR_IMAGE}:${{ inputs.version }}@${digest}"
          docker buildx imagetools inspect "${GHCR_IMAGE}:${{ inputs.version }}" --format '{{json .Manifest}}' | jq '{schemaVersion,digest,size}'
          provenance=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ inputs.version }}" --format '{{json .Provenance}}' | jq -c '."linux/amd64".SLSA.buildDefinition.resolvedDependencies')
          test -n "${provenance}"
          echo "${provenance}" | jq -e '.[] | select(.uri == "git+https://github.com/KubeTEE-AI/firecrawl@refs/heads/kubetee-provider-patch" and .digest.gitCommit == "'"${GITHUB_SHA}"'")' >/dev/null
          {
            echo "digest=${digest}"
            echo "image=${image}"
          } >> "${GITHUB_OUTPUT}"
          echo "## Firecrawl release" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Source: ${SOURCE_REPO}/commit/$(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Upstream base: ${UPSTREAM_REPO}/commit/$(git rev-parse "${{ inputs.base_tag }}^{commit}")" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Image: ${image}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Record immutable Git tag and release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY%/*}; repo=${GITHUB_REPOSITORY#*/}
          digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${{ inputs.version }}" --format '{{json .Manifest}}' | jq -r .digest)
          test "${digest}" = '${{ steps.build.outputs.digest }}'
          gh api "repos/${owner}/${repo}/git/refs" \
            -f ref="refs/tags/${{ inputs.version }}" \
            -f sha="${{ github.sha }}"
          gh release create "${{ inputs.version }}" \
            --repo "${owner}/${repo}" --target "${{ github.sha }}" \
            --title "Firecrawl ${{ inputs.version }} — attested provider search" \
            --generate-notes \
            --notes-file - <<RELEASE
Upstream base: ${{ inputs.base_tag }} (${{ steps.build.outputs.base_commit }}).
Exact source: ${{ steps.build.outputs.source_commit }}.
Provenance build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.
Immutable image: ${{ steps.build.outputs.image }}.

No provider credentials enter the image or runtime environment. Provider keys
arrive only inside an attested Kata TDX guest through CDH at /secrets/providers.
RELEASE

      - name: Clean release-checkout credentials and registry session
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          docker buildx rm kubetee-provider || true
          test ! -f src/.git/config || ! grep -q 'http.*extraheader' src/.git/config
